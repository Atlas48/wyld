<?xml version="1.0" encoding="utf-8" ?>
{% set border=background='#' %}
{% if type==CardType.Story %}
{% set background+='00BF00' %}
{% elif type==CardType.Boon %}
{% set background+='0000BF' %}
{% elif type==CardType.Waylay %}
{%  background+='BF0000' %}
{% endif %}
{% if special %}
{% set border+='D4AF37' %}
{% else %}
{% set border+='D4D4D4' %}
{% endif %}
<svg width="200" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="imgclip">
      <rect x="16" y="40" width="168" height="120" rx="4"></rect>
    </clipPath>
  </defs>
  <rect width="200" height="280"{{__pypugjs_attrs(attrs=[('fill',(background.replace(/00/g,"7F")))])}} rx="8"></rect>
  <rect x="4" y="4" width="192" height="272" fill="none"{{__pypugjs_attrs(attrs=[('stroke',(border))])}} stroke-width="4" rx="6"></rect>
  <image src="{{ datauri }}" x="16" y="40" width="168" height="120" clip-path="url(#imgclip)"></image>
  <rect x="12" y="170" width="176" height="36"{{__pypugjs_attrs(attrs=[('fill',(background)), ('stroke',(border))])}} stroke-width="2"></rect>
  <text x="100" y="194" font-family="serif" font-size="18" fill="#FFF" text-anchor="middle" font-weight="bold">{{(title)|escape}}</text>
  <text x="100" y="224" font-family="sans-serif" font-size="12" fill="#313131" text-anchor="middle">{%  let tl=content.split('\n') %}{% if  desc %}
    {{content|mdsvg}}
  </text>
  {% if defined(xp) and xp is not None and xp!=0 %}
  <circle cx="30" cy="30" r="20" fill="#4A5899" stroke="#7792D4" stroke-width="4" />
  <text x="30" y="38" font-family="serif" font-size="24" fill="#AAA" text-anchor="middle" font-weight="bold">{{ xp }}</text>
  {% endif %}
</svg>
